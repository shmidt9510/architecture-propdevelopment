apiVersion: v1
kind: Namespace
metadata:
  name: client-services
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-services
---
apiVersion: v1
kind: Namespace
metadata:
  name: bi-data
---
apiVersion: v1
kind: Namespace
metadata:
  name: finance
---
# admin
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: admin-role
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]
---
# client-developer
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: client-services
  name: client-developer
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# client-services-manager
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: client-services
  name: client-manager
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
---
# Role для аналитиков bi-data
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: bi-data
  name: bi-analytics
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
---
# tenant-services-dev
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: tenant-services
  name: tenant-developer
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
